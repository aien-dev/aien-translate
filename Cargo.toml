[package]
name = "aien-translate"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Translation service for translate.js, backed by AIEN's own inference runtime"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
form_urlencoded = "1"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tokio-stream = "0.1"

[profile.release]
lto = "thin"
